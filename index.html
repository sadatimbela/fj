<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FJ Visuals Builders - Under Construction</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="video-background">
        <div class="video-overlay"></div>
        <video playsinline autoplay muted loop id="hero-video">
            <!-- User needs to add the video source here -->
            <source src="video/hero.mp4" type="video/mp4">
            Your browser does not support the video tag.
        </video>
    </div>

    <header class="main-header">
        <nav class="main-nav">
            <div class="logo">
                <img src="assets/logo.svg" alt="FJ Visuals Builders Logo">
            </div>
            <ul class="nav-menu">
                <li><a href="#">Home</a></li>
                <li><a href="#">Portfolio</a></li>
                <li><a href="#">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main class="hero-section">
        <div class="hero-content">
            <h1 class="main-headline">
                <div class="headline-wrapper">
                    <span class="word">Shaping</span>
                    <span class="word">Spaces.</span>
                    <span class="word">Elevating</span>
                    <span class="word">Living.</span>
                </div>
            </h1>
            <p class="subtext">Our new digital experience is under construction.</p>
            <div class="loading-indicator">
                <div class="ring"></div>
                <p class="loading-text">Building Something Great…</p>
            </div>
        </div>
    </main>

    <div class="scroll-indicator"></div>

    <div class="particle-container"></div>
    <script src="js/main.js"></script>
</body>
</html>
